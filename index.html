<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node.js Akademi</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2330;--muted:#5d6678;--line:#dde1e8;--accent:#2f8f46;--accent2:#e8f5ec;--code:#0f1420;--codetext:#e6edf3;--err:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#30363d;--accent:#3fb950;--accent2:#12261a;--code:#010409}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
aside h1{font-size:19px;margin:0 0 4px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.level{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;font-weight:600}
.lesson-link{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.lesson-link:hover{background:var(--bg)}
.lesson-link.active{background:var(--accent2);color:var(--accent);font-weight:600}
.lesson-link .chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:11px}
.lesson-link.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;display:flex;overflow:hidden}
#content{flex:1;overflow-y:auto;padding:28px 36px;min-width:0}
#content h2{margin-top:0;font-size:26px}
#content h3{margin-top:28px}
#content code{background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:13px}
#content pre{background:var(--code);color:var(--codetext);padding:14px;border-radius:8px;overflow-x:auto;font-size:13px}
#content pre code{background:none;border:0;padding:0;color:inherit}
.note{border-left:4px solid var(--accent);background:var(--accent2);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0}
.note.warn{border-color:var(--warn);background:transparent;border:1px solid var(--line);border-left:4px solid var(--warn)}
.task{border:2px dashed var(--accent);padding:12px 16px;border-radius:8px;margin:20px 0}
.task.ok{border-style:solid;background:var(--accent2)}
.quiz{border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0;background:var(--panel)}
.quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font:inherit}
.quiz button.right{border-color:var(--accent);background:var(--accent2)}
.quiz button.wrong{border-color:var(--err);color:var(--err)}
.nav{display:flex;justify-content:space-between;margin-top:30px}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:var(--panel);color:var(--text);border:1px solid var(--line)}
#lab{width:46%;min-width:360px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--code)}
.labbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.labbar .title{flex:1;font-weight:600;font-size:13px;color:var(--muted)}
.edwrap{flex:1.3;position:relative;min-height:0;display:flex}
#gutter{padding:12px 6px 12px 10px;color:#4b5563;font:13px/1.55 ui-monospace,Consolas,monospace;text-align:right;user-select:none;overflow:hidden;white-space:pre}
#editor{flex:1;background:transparent;color:var(--codetext);border:0;outline:0;resize:none;padding:12px;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
.outbar{padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
#out{flex:1;overflow:auto;padding:10px 12px;font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--codetext);white-space:pre-wrap;margin:0;min-height:0}
#out .e{color:#ff7b72}#out .w{color:#e3b341}#out .i{color:#79c0ff}#out .s{color:#8b949e}
#menuBtn{display:none}
@media (max-width:1000px){
 body{flex-direction:column;height:auto;overflow:auto}
 aside{width:100%;display:none;border-right:0}aside.open{display:block}
 main{flex-direction:column;overflow:visible}
 #content{padding:16px}
 #lab{width:100%;min-width:0;height:80vh}
 #menuBtn{display:block;margin:8px 16px}
}
</style>
</head>
<body>
<button id="menuBtn" class="btn sec" onclick="document.querySelector('aside').classList.toggle('open')">☰ Dersler</button>
<aside>
  <h1>🟢 Node.js Akademi</h1>
  <div style="font-size:13px;color:var(--muted)">Kurulumsuz, sıfırdan ileri seviyeye</div>
  <div class="prog"><div id="progbar"></div></div>
  <div id="progtxt" style="font-size:12px;color:var(--muted)"></div>
  <div id="toc"></div>
</aside>
<main>
  <section id="content"></section>
  <section id="lab">
    <div class="labbar">
      <span class="title">📄 index.js — Node Laboratuvarı</span>
      <button class="btn sec" id="resetBtn" title="Dersin örnek koduna dön">↺ Sıfırla</button>
      <button class="btn sec" id="fixBtn" title="Kodu analiz et ve hataları düzelt (Ctrl+Shift+F)">🩺 Düzelt</button>
      <button class="btn" id="runBtn" title="Ctrl+Enter">▶ Çalıştır</button>
    </div>
    <div class="edwrap"><div id="gutter">1</div><textarea id="editor" spellcheck="false"></textarea></div>
    <div class="outbar"><span>$ node index.js</span><span id="status"></span></div>
    <pre id="out"></pre>
  </section>
</main>

<script>
/* =====================================================================
   NODE SİMÜLATÖRÜ — tarayıcıda çalışan, Node API'lerinin eğitim amaçlı
   bir alt kümesi: fs, fs/promises, path, events, util, os, http, crypto,
   buffer, stream, timers, process ve localhost'a fetch.
   ===================================================================== */
const VFS = {};            // sanal dosya sistemi: { '/proje/a.txt': 'içerik' }
function resetVFS(){
  for (const k in VFS) delete VFS[k];
  VFS['/proje/merhaba.txt'] = 'Merhaba Node.js!\nBu dosya sanal dosya sisteminde yaşıyor.';
  VFS['/proje/veri.json'] = JSON.stringify({ kullanicilar:[{id:1,ad:'Ayşe'},{id:2,ad:'Mehmet'}] }, null, 2);
  VFS['/proje/log.txt'] = 'satir 1\nsatir 2\nsatir 3\nsatir 4\nsatir 5';
}

function inspect(v, depth=0, seen=new WeakSet()){
  if (typeof v === 'string') return depth ? `'${v}'` : v;
  if (v === null) return 'null';
  if (v === undefined) return 'undefined';
  if (typeof v === 'function') return v.prototype && /^class /.test(v.toString()) ? `[class ${v.name}]` : `[Function: ${v.name||'(anonymous)'}]`;
  if (typeof v === 'bigint') return v+'n';
  if (typeof v === 'symbol') return v.toString();
  if (typeof v !== 'object') return String(v);
  if (seen.has(v)) return '[Circular]';
  const tg = tag(v);
  if (tg==='Error') return v.stack && depth===0 ? `${v.name}: ${v.message}` : `[${v.name}: ${v.message}]`;
  if (tg==='Date') return v.toISOString();
  if (tg==='RegExp') return v.toString();
  if (v instanceof NodeBuffer) return `<Buffer ${[...v.bytes.slice(0,50)].map(b=>b.toString(16).padStart(2,'0')).join(' ')}${v.length>50?' ...':''}>`;
  if (tg==='Promise') return 'Promise { <pending> }';
  if (depth > 3) return Array.isArray(v) ? '[Array]' : '[Object]';
  seen.add(v);
  if (tg==='Map') return `Map(${v.size}) { ${[...v].map(([k,x])=>inspect(k,depth+1,seen)+' => '+inspect(x,depth+1,seen)).join(', ')} }`;
  if (tg==='Set') return `Set(${v.size}) { ${[...v].map(x=>inspect(x,depth+1,seen)).join(', ')} }`;
  if (Array.isArray(v)) { const s = v.map(x=>inspect(x,depth+1,seen)); return s.join(', ').length>70 ? `[\n${'  '.repeat(depth+1)}${s.join(',\n'+'  '.repeat(depth+1))}\n${'  '.repeat(depth)}]` : `[ ${s.join(', ')} ]`; }
  const keys = Object.keys(v);
  const name = v.constructor && v.constructor.name && v.constructor.name !== 'Object' ? v.constructor.name+' ' : '';
  if (!keys.length) return name+'{}';
  const parts = keys.map(k=>`${/^[a-zA-Z_$][\w$]*$/.test(k)?k:`'${k}'`}: ${inspect(v[k],depth+1,seen)}`);
  return parts.join(', ').length>70 ? `${name}{\n${'  '.repeat(depth+1)}${parts.join(',\n'+'  '.repeat(depth+1))}\n${'  '.repeat(depth)}}` : `${name}{ ${parts.join(', ')} }`;
}
function format(...a){
  if (typeof a[0]==='string' && /%[sdifjoO%]/.test(a[0])) {
    let f=a.shift();
    f=f.replace(/%([sdifjoO%])/g,(m,c)=>{ if(c==='%')return'%'; if(!a.length)return m; const x=a.shift();
      return c==='s'?String(x):c==='d'||c==='i'?String(parseInt(x)):c==='f'?String(parseFloat(x)):c==='j'?JSON.stringify(x):inspect(x,1);});
    return [f,...a.map(x=>inspect(x))].join(' ');
  }
  return a.map(x=>inspect(x)).join(' ');
}

// ---------- events ----------
class EventEmitter {
  constructor(){ this._ev = {}; }
  on(n,f){ (this._ev[n] ||= []).push(f); return this; }
  addListener(n,f){ return this.on(n,f); }
  prependListener(n,f){ (this._ev[n] ||= []).unshift(f); return this; }
  once(n,f){ const w=(...a)=>{ this.off(n,w); f.apply(this,a); }; w.orig=f; return this.on(n,w); }
  off(n,f){ if(this._ev[n]) this._ev[n]=this._ev[n].filter(x=>x!==f && x.orig!==f); return this; }
  removeListener(n,f){ return this.off(n,f); }
  removeAllListeners(n){ n ? delete this._ev[n] : this._ev={}; return this; }
  emit(n,...a){ const l=this._ev[n]; if(!l||!l.length){ if(n==='error') throw a[0]; return false; } [...l].forEach(f=>f.apply(this,a)); return true; }
  listenerCount(n){ return (this._ev[n]||[]).length; }
  eventNames(){ return Object.keys(this._ev).filter(k=>this._ev[k].length); }
}
EventEmitter.once = (em,n)=>new Promise(r=>em.once(n,(...a)=>r(a)));
EventEmitter.EventEmitter = EventEmitter;

// ---------- Buffer ----------
class NodeBuffer {
  constructor(bytes){ this.bytes = bytes; }
  static from(x, enc='utf8'){
    if (x instanceof NodeBuffer) return new NodeBuffer(x.bytes.slice());
    if (Array.isArray(x) || x instanceof Uint8Array) return new NodeBuffer(Uint8Array.from(x));
    x=String(x);
    if (enc==='hex') return new NodeBuffer(Uint8Array.from(x.match(/../g)||[],h=>parseInt(h,16)));
    if (enc==='base64') return new NodeBuffer(Uint8Array.from(atob(x),c=>c.charCodeAt(0)));
    return new NodeBuffer(new TextEncoder().encode(x));
  }
  static alloc(n,fill=0){ return new NodeBuffer(new Uint8Array(n).fill(fill)); }
  static concat(list){ const t=new Uint8Array(list.reduce((s,b)=>s+b.length,0)); let o=0; list.forEach(b=>{t.set(b.bytes,o);o+=b.length;}); return new NodeBuffer(t); }
  static byteLength(s){ return new TextEncoder().encode(s).length; }
  static isBuffer(b){ return b instanceof NodeBuffer; }
  get length(){ return this.bytes.length; }
  toString(enc='utf8'){
    if (enc==='hex') return [...this.bytes].map(b=>b.toString(16).padStart(2,'0')).join('');
    if (enc==='base64') return btoa(String.fromCharCode(...this.bytes));
    return new TextDecoder().decode(this.bytes);
  }
  toJSON(){ return {type:'Buffer',data:[...this.bytes]}; }
  slice(a,b){ return new NodeBuffer(this.bytes.slice(a,b)); }
  subarray(a,b){ return this.slice(a,b); }
  equals(o){ return this.toString('hex')===o.toString('hex'); }
  write(s,off=0){ const e=new TextEncoder().encode(s); this.bytes.set(e.slice(0,this.length-off),off); return Math.min(e.length,this.length-off); }
  [Symbol.iterator](){ return this.bytes[Symbol.iterator](); }
}
// buf[0] gibi indeks erişimi için Proxy
const BufferProxyHandler = { get(t,p){ if(typeof p==='string' && /^\d+$/.test(p)) return t.bytes[p]; const v=t[p]; return typeof v==='function'?v.bind(t):v; },
  set(t,p,v){ if(/^\d+$/.test(p)) t.bytes[p]=v; else t[p]=v; return true; } };
const Buffer = new Proxy(NodeBuffer, { get(t,p){ const v=t[p]; if(typeof v==='function' && ['from','alloc','concat'].includes(p)) return (...a)=>new Proxy(v.apply(t,a),BufferProxyHandler); return v; } });

// ---------- path ----------
const path = {
  sep:'/', delimiter:':',
  normalize(p){ const abs=p.startsWith('/'); const out=[]; p.split('/').forEach(s=>{ if(!s||s==='.')return; if(s==='..'){ if(out.length&&out[out.length-1]!=='..')out.pop(); else if(!abs)out.push('..'); } else out.push(s); }); return (abs?'/':'')+out.join('/') || (abs?'/':'.'); },
  join(...a){ return path.normalize(a.filter(Boolean).join('/')); },
  resolve(...a){ let r=''; for(let i=a.length-1;i>=0;i--){ r=a[i]+(r?'/'+r:''); if(a[i].startsWith('/'))break; } if(!r.startsWith('/')) r='/proje/'+r; return path.normalize(r).replace(/\/$/,'')||'/'; },
  basename(p,ext){ let b=p.replace(/\/+$/,'').split('/').pop(); if(ext&&b.endsWith(ext)) b=b.slice(0,-ext.length); return b; },
  dirname(p){ const i=p.replace(/\/+$/,'').lastIndexOf('/'); return i<=0?(p.startsWith('/')?'/':'.'):p.slice(0,i); },
  extname(p){ const b=path.basename(p); const i=b.lastIndexOf('.'); return i<=0?'':b.slice(i); },
  isAbsolute(p){ return p.startsWith('/'); },
  relative(f,t){ const a=path.resolve(f).split('/').filter(Boolean), b=path.resolve(t).split('/').filter(Boolean); let i=0; while(i<a.length&&a[i]===b[i])i++; return [...Array(a.length-i).fill('..'),...b.slice(i)].join('/'); },
  parse(p){ const base=path.basename(p), ext=path.extname(p); return { root:p.startsWith('/')?'/':'', dir:path.dirname(p), base, ext, name:ext?base.slice(0,-ext.length):base }; },
  format(o){ return (o.dir?o.dir+'/':'')+(o.base||(o.name||'')+(o.ext||'')); },
};
path.posix = path;

// ---------- fs ----------
function fsErr(code,syscall,p){ const msg={ENOENT:'no such file or directory',EEXIST:'file already exists',ENOTDIR:'not a directory',EISDIR:'illegal operation on a directory'}[code]; const e=new Error(`${code}: ${msg}, ${syscall} '${p}'`); e.code=code; e.syscall=syscall; e.path=p; e.errno=-2; return e; }
const isDir = p => p==='/' || p==='/proje' || Object.keys(VFS).some(k=>k.startsWith(p.replace(/\/$/,'')+'/')) || VFS[p]===DIR;
const DIR = Symbol('dir');
const enc = (data,o) => { const e = typeof o==='string'?o:o&&o.encoding; return e ? data : Buffer.from(data); };
const fsSync = {
  readFileSync(p,o){ p=path.resolve(String(p)); if(isDir(p)&&VFS[p]===undefined||VFS[p]===DIR) throw fsErr('EISDIR','read',p); if(!(p in VFS)) throw fsErr('ENOENT','open',p); return enc(VFS[p],o); },
  writeFileSync(p,d){ p=path.resolve(String(p)); if(!isDir(path.dirname(p))) throw fsErr('ENOENT','open',p); VFS[p]= d instanceof NodeBuffer? d.toString(): typeof d==='string'?d:String(d); },
  appendFileSync(p,d){ p=path.resolve(String(p)); VFS[p]=(VFS[p]&&VFS[p]!==DIR?VFS[p]:'')+(d instanceof NodeBuffer?d.toString():String(d)); },
  existsSync(p){ p=path.resolve(String(p)); return p in VFS || isDir(p); },
  unlinkSync(p){ p=path.resolve(String(p)); if(!(p in VFS)) throw fsErr('ENOENT','unlink',p); delete VFS[p]; },
  mkdirSync(p,o={}){ p=path.resolve(String(p)); if(isDir(p)){ if(o.recursive) return; throw fsErr('EEXIST','mkdir',p);} if(!o.recursive && !isDir(path.dirname(p))) throw fsErr('ENOENT','mkdir',p); VFS[p]=DIR; },
  readdirSync(p,o={}){ p=path.resolve(String(p)); if(!isDir(p)) throw fsErr(p in VFS?'ENOTDIR':'ENOENT','scandir',p); const pre=p.replace(/\/$/,'')+'/'; const names=new Set(); Object.keys(VFS).forEach(k=>{ if(k.startsWith(pre)) names.add(k.slice(pre.length).split('/')[0]); }); const arr=[...names].sort(); return o.withFileTypes? arr.map(n=>({name:n,isFile:()=>!isDir(pre+n),isDirectory:()=>isDir(pre+n)})) : arr; },
  statSync(p){ p=path.resolve(String(p)); const d=isDir(p); if(!d && !(p in VFS)) throw fsErr('ENOENT','stat',p); return { size:d?4096:new TextEncoder().encode(VFS[p]).length, isFile:()=>!d, isDirectory:()=>d, mtime:new Date(), birthtime:new Date() }; },
  renameSync(a,b){ a=path.resolve(a); b=path.resolve(b); if(!(a in VFS)) throw fsErr('ENOENT','rename',a); VFS[b]=VFS[a]; delete VFS[a]; },
  copyFileSync(a,b){ fsSync.writeFileSync(b,fsSync.readFileSync(a,'utf8')); },
  rmSync(p,o={}){ p=path.resolve(String(p)); if(!fsSync.existsSync(p)){ if(o.force) return; throw fsErr('ENOENT','rm',p);} Object.keys(VFS).forEach(k=>{ if(k===p||k.startsWith(p+'/')) delete VFS[k]; }); },
};
// G/Ç işlemleri laboratuvarın zamanlayıcısıyla planlanır: süreç bitene kadar beklenir, hatalar yakalanır
let schedule = (f,ms)=>setTimeout(f,ms);
const fsPromises = {}; const fs = { ...fsSync, promises: fsPromises, constants:{F_OK:0,R_OK:4,W_OK:2} };
Object.keys(fsSync).forEach(k=>{
  const base=k.replace(/Sync$/,''); if(base==='exists') return;
  fsPromises[base] = (...a)=> new Promise((res,rej)=> schedule(()=>{ try{ res(fsSync[k](...a)); }catch(e){ rej(e); } }, 5+Math.random()*10));
  fs[base] = (...a)=>{ const cb=a.pop(); if(typeof cb!=='function') throw new TypeError('Callback must be a function'); schedule(()=>{ let r; try{ r=fsSync[k](...a); }catch(e){ return cb(e); } cb(null,r); }, 5+Math.random()*10); };
});
fsPromises.access = p => fsPromises.stat(p).then(()=>undefined);
fs.access = (p,...r)=>{ const cb=r.pop(); fs.stat(p,e=>cb(e||null)); };

// ---------- stream ----------
class Readable extends EventEmitter {
  constructor(o={}){ super(); this._read=o.read; this.buf=[]; this.ended=false; this.flowing=false; this.objectMode=!!o.objectMode; }
  push(c){ if(c===null){ this.ended=true; } else this.buf.push(c); this._flow(); return true; }
  on(n,f){ super.on(n,f); if(n==='data'){ this.flowing=true; queueMicrotask(()=>this._flow()); } return this; }
  _flow(){ if(!this.flowing||this._flowing) return; this._flowing=true; setTimeout(()=>{ this._flowing=false; while(this.buf.length){ this.emit('data',this.buf.shift()); } if(this.ended && !this._endEmitted){ this._endEmitted=true; this.emit('end'); this.emit('close'); } else if(!this.ended && this._read) { this._read(); } },0); }
  pipe(dest){ this.on('data',c=>dest.write(c)); this.on('end',()=>dest.end&&dest.end()); return dest; }
  async *[Symbol.asyncIterator](){ const q=[]; let done=false, wake; this.on('data',c=>{q.push(c);wake&&wake();}); this.on('end',()=>{done=true;wake&&wake();}); while(true){ if(q.length){ yield q.shift(); continue; } if(done) return; await new Promise(r=>wake=r); wake=null; } }
  static from(it){ const r=new Readable({objectMode:true}); (async()=>{ for await (const x of it) r.push(x); r.push(null); })(); return r; }
}
class Writable extends EventEmitter {
  constructor(o={}){ super(); this._write=o.write; this._final=o.final; }
  write(c,e,cb){ this._write ? this._write(c, typeof e==='string'?e:'utf8', ()=>{}) : 0; return true; }
  end(c){ if(c!==undefined) this.write(c); setTimeout(()=>{ this._final&&this._final(()=>{}); this.emit('finish'); this.emit('close'); },0); }
}
class Transform extends Readable {
  constructor(o={}){ super(o); this._transform=o.transform; this._flush=o.flush; }
  write(c){ this._transform(c,'utf8',(err,data)=>{ if(data!==undefined&&data!==null) this.push(data); }); return true; }
  end(){ if(this._flush) this._flush((e,d)=>{ if(d) this.push(d); this.push(null); }); else this.push(null); }
}
const pipeline = (...s)=>{ const cb = typeof s[s.length-1]==='function'?s.pop():null; for(let i=0;i<s.length-1;i++) s[i].pipe(s[i+1]); const last=s[s.length-1]; const p=new Promise(r=>{ last.on('finish',r); last.on('end',r); }); if(cb) p.then(()=>cb()); return p; };
fs.createReadStream = (p,o={})=>{ const data=fsSync.readFileSync(p,'utf8'); const size=o.highWaterMark||16; const r=new Readable(); let i=0; r._read=()=>{ if(i>=data.length) return r.push(null); r.push(o.encoding?data.slice(i,i+size):Buffer.from(data.slice(i,i+size))); i+=size; }; r._read(); return r; };
fs.createWriteStream = p=>{ p=path.resolve(p); VFS[p]=''; return new Writable({ write(c,e,cb){ VFS[p]+=String(c); cb(); } }); };
const stream = { Readable, Writable, Transform, pipeline, promises:{ pipeline } };

// ---------- util ----------
const util = {
  format, inspect:(v,o)=>inspect(v,1),
  promisify: fn => (...a)=> new Promise((res,rej)=> fn(...a,(e,r)=> e?rej(e):res(r))),
  callbackify: fn => (...a)=>{ const cb=a.pop(); fn(...a).then(r=>cb(null,r),cb); },
  isDeepStrictEqual:(a,b)=>JSON.stringify(a)===JSON.stringify(b),
  types:{ isPromise:p=>p instanceof Promise, isDate:d=>d instanceof Date },

lesson('Orta','async','Promise & async/await', `
<p><b>Promise</b>, gelecekte tamamlanacak bir işin temsilidir: <code>pending → fulfilled</code> veya <code>rejected</code>.</p>
<pre><code>const p = new Promise((resolve, reject) =&gt; { ... });
p.then(sonuc =&gt; ...).catch(hata =&gt; ...);</code></pre>
<p><b>async/await</b>, Promise'leri senkron kod gibi okunabilir yazmanı sağlar:</p>
<pre><code>async function calis() {

    const veri = await oku();
  } catch (e) { ... }
}</code></pre>
<h3>Paralel çalıştırma</h3>
<ul>
<li><code>Promise.all([...])</code> — hepsi bitince, biri hata verirse hepsi düşer</li>
<li><code>Promise.allSettled([...])</code> — her birinin sonucunu ayrı verir</li>
<li><code>Promise.race([...])</code> — ilk biten kazanır (timeout için ideal)</li>
</ul>
<div class="note">💡 Laboratuvarda (ve Node ES modüllerinde) <b>top-level await</b> kullanabilirsin.</div>
<div class="task" data-task>🎯 <b>Görev:</b> <code>Promise.race</code> ile <code>bekle(500)</code> ve 100 ms'de reject olan bir zaman aşımı yarıştır; hatayı yakalayıp <code>Zaman aşımı</code> yazdır.</div>
`, `
const bekle = (ms) => new Promise(res => setTimeout(() => res(ms), ms));

async function kullaniciGetir(id) {
  await bekle(50);

  return { id, ad: "Kullanıcı " + id };

const b = await kullaniciGetir(2);

  await kullaniciGetir(-1);
} catch (e) {

lesson('Orta','rest','REST API: CRUD uygulaması', `
<p>Gerçek bir API; kaynakları <b>HTTP metotlarıyla</b> yönetir:</p>
<table>
<tr><td><code>GET /gorevler</code></td><td>Listele</td></tr>
<tr><td><code>GET /gorevler/:id</code></td><td>Tekini getir</td></tr>
<tr><td><code>POST /gorevler</code></td><td>Oluştur (201)</td></tr>
<tr><td><code>PUT /gorevler/:id</code></td><td>Güncelle</td></tr>
<tr><td><code>DELETE /gorevler/:id</code></td><td>Sil (204)</td></tr>
</table>
<h3>İstek gövdesini (body) okumak</h3>
<p><code>req</code> bir stream'dir; veri parça parça gelir:</p>
<pre><code>let body = '';
req.on('data', c =&gt; body += c);
req.on('end', () =&gt; JSON.parse(body));</code></pre>
<p>veya modern yöntem: <code>for await (const chunk of req)</code>.</p>
<div class="task" data-task>🎯 <b>Görev:</b> <code>DELETE /gorevler/1</code> desteği ekle (204 dönsün) ve test et. Çıktıda <code>204</code> geçmeli.</div>
`, `
const http = require("http");

let gorevler = [{ id: 1, baslik: "Node öğren", bitti: false }];
let sonId = 1;

async function govdeOku(req) {
  let body = "";
  for await (const chunk of req) body += chunk;
  return body ? JSON.parse(body) : {};
}
function json(res, kod, veri) {
  res.writeHead(kod, { "Content-Type": "application/json" });
  res.end(veri === undefined ? "" : JSON.stringify(veri));
}

const server = http.createServer(async (req, res) => {
  const [, kaynak, id] = req.url.split("/");
  if (kaynak !== "gorevler") return json(res, 404, { hata: "Yok" });

  try {
    if (req.method === "GET" && !id) return json(res, 200, gorevler);
    if (req.method === "GET") {
      const g = gorevler.find(x => x.id === +id);
      return g ? json(res, 200, g) : json(res, 404, { hata: "Görev yok" });
    }
    if (req.method === "POST") {
      const { baslik } = await govdeOku(req);
      if (!baslik) return json(res, 400, { hata: "baslik zorunlu" });
      const g = { id: ++sonId, baslik, bitti: false };
      gorevler.push(g);
      return json(res, 201, g);
    }
    if (req.method === "PUT" && id) {
      const g = gorevler.find(x => x.id === +id);
      if (!g) return json(res, 404, { hata: "Görev yok" });
      Object.assign(g, await govdeOku(req));
      return json(res, 200, g);
    }
    json(res, 405, { hata: "Desteklenmeyen metot" });
  } catch (e) {
    json(res, 500, { hata: e.message });
  }
});
server.listen(4000);

// ---- İstemci tarafı testler ----
const api = async (method, url, body) => {
  const r = await fetch("http://localhost:4000" + url, {
    method, headers: { "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });
  const t = await r.text();
  console.log(method.padEnd(6), url.padEnd(14), r.status, t);
};

await api("GET", "/gorevler");
await api("POST", "/gorevler", { baslik: "API yaz" });
await api("POST", "/gorevler", {});
await api("PUT", "/gorevler/1", { bitti: true });

lesson('Orta','hata','Hata yönetimi', `
<p>Sağlam bir Node uygulaması hataları <b>öngörür ve yönetir</b>.</p>
<h3>Hata türleri</h3>
<ul>
<li><b>Operasyonel:</b> dosya yok, ağ koptu, geçersiz girdi → yakala, kullanıcıya düzgün cevap ver.</li>
<li><b>Programcı hatası:</b> <code>undefined.x</code>, yanlış tip → düzelt; süreci yeniden başlatmak en güvenlisi.</li>
</ul>
<h3>Özel hata sınıfları</h3>
<pre><code>class BulunamadiHatasi extends Error {
  constructor(m) { super(m); this.name = 'BulunamadiHatasi'; this.status = 404; }
}</code></pre>
<h3>Son savunma hattı</h3>
<pre><code>process.on('uncaughtException', ...)
process.on('unhandledRejection', ...)</code></pre>
<div class="note warn">⚠️ <code>await</code> edilmeyen bir Promise'in hatası yakalanmaz! Node 15+ bu durumda süreci çökertir.</div>
<div class="task" data-task>🎯 <b>Görev:</b> <code>YetkiHatasi</code> adında, <code>status = 401</code> olan bir sınıf yaz, fırlat, yakala ve <code>401</code> yazdır.</div>
`, `
class UygulamaHatasi extends Error {
  constructor(mesaj, status = 500) {
    super(mesaj);
    this.name = this.constructor.name;
    this.status = status;
  }
}
class DogrulamaHatasi extends UygulamaHatasi {
  constructor(alan) { super(\`'\${alan}' alanı geçersiz\`, 400); this.alan = alan; }
}

function kayitOl({ email, sifre }) {
  if (!email?.includes("@")) throw new DogrulamaHatasi("email");
  if ((sifre ?? "").length < 8) throw new DogrulamaHatasi("sifre");
  return { ok: true };
}

for (const girdi of [{ email: "x" }, { email: "a@b.c", sifre: "123" }, { email: "a@b.c", sifre: "12345678" }]) {
  try {
    console.log(kayitOl(girdi));
  } catch (e) {
    if (e instanceof DogrulamaHatasi) console.log(\`[\${e.status}] \${e.name}: \${e.message}\`);
    else throw e;
  }
}

// Yakalanmayan Promise hatası için son savunma
process.on("unhandledRejection", (sebep) => {
  console.error("Yakalanmamış red:", sebep.message);
});
Promise.reject(new Error("unutulmuş await"));
`, { check: o => /401/.test(o) });

lesson('İleri','eventloop','Event Loop derinlemesine', `
<p>Node tek iş parçacıklı JavaScript çalıştırır, ama <b>libuv</b> sayesinde G/Ç işlerini arka planda yapar. Sıra kimin? Event loop karar verir:</p>
<pre><code>   ┌───────────────────────────┐
┌─&gt;│        timers             │  setTimeout, setInterval
│  ├───────────────────────────┤
│  │     pending callbacks     │
│  ├───────────────────────────┤
│  │        poll               │  G/Ç olayları (fs, ağ)
│  ├───────────────────────────┤
│  │        check              │  setImmediate
│  ├───────────────────────────┤
└──┤     close callbacks       │
   └───────────────────────────┘
 Her aşama arasında: process.nextTick kuyruğu → Promise (microtask) kuyruğu</code></pre>
<h3>Öncelik sırası (Node'da)</h3>
<ol><li>Senkron kod</li><li><code>process.nextTick</code></li><li>Promise <code>.then</code> / <code>queueMicrotask</code></li><li><code>setTimeout(0)</code> / <code>setImmediate</code></li></ol>
<div class="note warn">⚠️ Simülatör tarayıcının event loop'unu kullanır: <code>nextTick</code> burada bir microtask gibi davranır. Gerçek Node'da örnek çıktı: <code>1 sync, 6 sync, 3 nextTick, 2 promise, 4 timeout, 5 immediate</code>.</div>
<h3>Event loop'u bloklamak</h3>
<p>Ağır CPU işleri (büyük döngüler, şifreleme, resim işleme) tüm sunucuyu durdurur. Çözümler: işi parçalara bölmek, <code>worker_threads</code>, ayrı servis.</p>
<div class="task" data-task>🎯 <b>Görev:</b> Bloklayan döngüyü <code>setImmediate</code> ile parçalara bölünmüş hale getirmeyi dene; ya da sadece kodu çalıştırıp <code>tick</code> mesajlarının neden geciktiğini gözlemle. (Çıktıda <code>blok</code> geçmesi yeterli.)</div>
`, `
console.log("1 sync");
Promise.resolve().then(() => console.log("2 promise"));
process.nextTick(() => console.log("3 nextTick"));
setTimeout(() => console.log("4 timeout"), 0);
setImmediate(() => console.log("5 immediate"));
console.log("6 sync");

// Event loop'u bloklamak:
setTimeout(() => {
  const t = Date.now();
  const id = setInterval(() => console.log("tick", Date.now() - t, "ms"), 50);

  setTimeout(() => {
    console.log("--- 300ms'lik blok başlıyor ---");
    const bitis = Date.now() + 300;
    while (Date.now() < bitis) {} // CPU'yu kilitler!
    console.log("--- blok bitti ---");
  }, 120);

  setTimeout(() => clearInterval(id), 600);
}, 20);
`, { check: o => /blok/.test(o), quiz:{ q:'Gerçek Node.js\'te hangisi önce çalışır?', a:['setTimeout(fn, 0)','Promise.then','process.nextTick','setImmediate'], c:2 } });

lesson('İleri','streams','Streams: büyük veriyi akıtmak', `
<p>1 GB'lık bir log dosyasını <code>readFile</code> ile okursan tamamı belleğe yüklenir. <b>Stream</b>'ler veriyi <b>parça parça (chunk)</b> işler: sabit, düşük bellek.</p>
<ul>
<li><b>Readable</b> — okunabilir kaynak (dosya, HTTP isteği)</li>
<li><b>Writable</b> — yazılabilir hedef (dosya, HTTP cevabı)</li>
<li><b>Transform</b> — akarken dönüştüren (sıkıştırma, şifreleme)</li>
</ul>
<pre><code>fs.createReadStream('buyuk.log')
  .pipe(zlib.createGzip())
  .pipe(fs.createWriteStream('buyuk.log.gz'));</code></pre>
<p>Modern yöntem: <code>await pipeline(a, b, c)</code> — hataları ve kapanışı otomatik yönetir.</p>
<div class="task" data-task>🎯 <b>Görev:</b> Transform'u, her satırın başına satır numarası ekleyecek şekilde değiştir. Çıktıda <code>1:</code> geçmeli.</div>
`, `
const fs = require("fs");
const { Readable, Transform, pipeline } = require("stream");

// 1) Dosyayı küçük parçalarla okumak
const okuyucu = fs.createReadStream("log.txt", { encoding: "utf8", highWaterMark: 12 });
let parca = 0;
okuyucu.on("data", (chunk) => console.log(\`chunk #\${++parca}:\`, JSON.stringify(chunk)));
okuyucu.on("end", () => console.log("Okuma bitti\\n"));

await new Promise(r => okuyucu.on("end", r));

// 2) Transform stream: büyük harfe çevir
const buyukHarf = new Transform({
  transform(chunk, enc, cb) {
    cb(null, String(chunk).toUpperCase());
  },
});

await pipeline(
  fs.createReadStream("log.txt", { encoding: "utf8" }),
  buyukHarf,
  fs.createWriteStream("log-buyuk.txt")
);
console.log(fs.readFileSync("log-buyuk.txt", "utf8"));

// 3) Async iterator ile okuma
for await (const sayi of Readable.from([1, 2, 3])) {
  console.log("sayı:", sayi);
}
`, { check: o => /^1:/m.test(o) || /\b1:\s/.test(o) });

lesson('İleri','util','util: promisify ve yardımcılar', `
<p>Eski callback tabanlı API'leri Promise'e çevirmek için <code>util.promisify</code> kullanılır. Bu, eski kütüphanelerle modern kod yazmanın anahtarıdır.</p>
<pre><code>const oku = util.promisify(fs.readFile);
const veri = await oku('a.txt', 'utf8');</code></pre>
<p>Diğer yararlılar: <code>util.format</code> (printf), <code>util.inspect</code> (derin nesne gösterimi), <code>util.isDeepStrictEqual</code>, <code>util.types</code>.</p>

<div class="task" data-task>🎯 <b>Görev:</b> <code>eskiApi</code>'nin hata veren çağrısını (<code>eskiApi(-1)</code>) promisify edilmiş haliyle çağırıp <code>try/catch</code> ile yakala, <code>negatif</code> kelimesini yazdır.</div>
`, `

lesson('İleri','crypto','crypto: hash, HMAC, rastgelelik', `
<p>Güvenlik Node geliştiricisinin sorumluluğudur. <code>crypto</code> modülü temel araçları verir:</p>
<ul>
<li><b>Hash (SHA-256):</b> Tek yönlü özet. Dosya bütünlüğü, önbellek anahtarları.</li>
<li><b>HMAC:</b> Gizli anahtarla imzalı hash. Webhook doğrulama, JWT imzası.</li>
<li><b>randomUUID / randomBytes:</b> Kriptografik olarak güvenli rastgelelik. Token, ID üretimi.</li>
</ul>
<div class="note warn">⚠️ Şifreleri <b>asla</b> düz SHA-256 ile saklama! <code>crypto.scrypt</code>, bcrypt veya argon2 gibi yavaş, tuzlu (salt) algoritmalar kullan. <br>⚠️ <code>Math.random()</code> güvenlik için uygun değildir.</div>
<div class="note">Simülatör yalnızca <code>sha256</code> destekler; gerçek Node'da <code>md5</code>, <code>sha512</code> vb. de vardır.</div>
<div class="task" data-task>🎯 <b>Görev:</b> Basit bir "imzalı token" üret: <code>veri + "." + hmac(veri)</code>. Sonra imzayı doğrulayan bir fonksiyon yazıp <code>Geçerli: true</code> yazdır.</div>
`, `
const crypto = require("crypto");

// SHA-256 hash
const hash = crypto.createHash("sha256").update("merhaba").digest("hex");
console.log("SHA-256:", hash);

// Aynı girdi → aynı hash; tek harf değişince tamamen farklı
console.log("SHA-256:", crypto.createHash("sha256").update("Merhaba").digest("hex"));

// HMAC — webhook imzası doğrulama
const GIZLI = "cok-gizli-anahtar";
const govde = JSON.stringify({ olay: "odeme.basarili", tutar: 250 });
const imza = crypto.createHmac("sha256", GIZLI).update(govde).digest("hex");
console.log("İmza:", imza);

// Güvenli rastgelelik
console.log("UUID:", crypto.randomUUID());
console.log("Token:", crypto.randomBytes(16).toString("hex"));
`, { check: o => /Geçerli:\s*true/.test(o) });

lesson('İleri','middleware','Mini Express: middleware deseni', `
<p>Express, Koa, Fastify gibi framework'lerin kalbi <b>middleware zinciri</b>dir: her istek bir dizi fonksiyondan geçer, her biri <code>next()</code> ile sıradakine paslar.</p>
<pre><code>app.use(logger);
app.use(auth);
app.get('/profil', (req, res) =&gt; ...);</code></pre>
<p>Sağdaki kodda <b>sıfırdan, 40 satırda</b> Express benzeri bir framework yazıyoruz. Bunu anlarsan Express'i "sihir" olmaktan çıkarırsın.</p>
<div class="task" data-task>🎯 <b>Görev:</b> İstek süresini ölçüp <code>X-Response-Time</code> başlığı ekleyen bir middleware yaz ve test cevabında bu başlığı yazdır (çıktıda <code>ms</code> geçmeli ve <code>X-Response-Time</code> kelimesi).</div>
`, `
const http = require("http");

function mini() {
  const katmanlar = [];
  const app = (req, res) => {
    const u = new URL(req.url, "http://x");
    req.path = u.pathname;
    req.query = Object.fromEntries(u.searchParams);
    res.json = (v, kod = 200) => { res.writeHead(kod, { "Content-Type": "application/json" }); res.end(JSON.stringify(v)); };
    let i = 0;
    const next = (err) => {
      const k = katmanlar[i++];
      if (!k) return res.json({ hata: err?.message || "Bulunamadı" }, err ? 500 : 404);
      if (k.method && (k.method !== req.method || !eslesir(k.path, req))) return next(err);
      try {
        if (err) return k.fn.length === 4 ? k.fn(err, req, res, next) : next(err);
        if (k.fn.length === 4) return next();
        k.fn(req, res, next);
      } catch (e) { next(e); }
    };
    next();
  };
  const eslesir = (desen, req) => {
    const a = desen.split("/"), b = req.path.split("/");
    if (a.length !== b.length) return false;
    req.params = {};
    return a.every((p, i) => p.startsWith(":") ? (req.params[p.slice(1)] = b[i], true) : p === b[i]);
  };
  app.use = (fn) => katmanlar.push({ fn });
  for (const m of ["GET", "POST", "PUT", "DELETE"])
    app[m.toLowerCase()] = (path, fn) => katmanlar.push({ method: m, path, fn });
  app.listen = (...a) => http.createServer(app).listen(...a);
  return app;
}

// ---- Kullanım ----
const app = mini();
app.use((req, res, next) => { console.log("[log]", req.method, req.url); next(); });
app.use((req, res, next) => {
  if (req.path.startsWith("/admin") && req.headers["x-token"] !== "123")
    return res.json({ hata: "Yetkisiz" }, 401);
  next();
});
app.get("/kullanici/:id", (req, res) => res.json({ id: req.params.id, q: req.query }));
app.get("/admin/panel", (req, res) => res.json({ hosgeldin: "admin" }));
app.get("/patla", () => { throw new Error("Bir şeyler ters gitti"); });
app.use((err, req, res, next) => res.json({ hata: err.message }, 500));

const srv = app.listen(5000);
for (const [url, h] of [["/kullanici/7?detay=1"], ["/admin/panel"], ["/admin/panel", { "x-token": "123" }], ["/patla"], ["/yok"]]) {
  const r = await fetch("http://localhost:5000" + url, { headers: h });
  console.log("   ←", r.status, await r.text());
}
srv.close();
`, { check: o => /X-Response-Time/i.test(o) && /ms/.test(o) });

lesson('İleri','test','Test yazmak: node:test & assert', `
<p>Node 18+ yerleşik bir test çalıştırıcıyla gelir: <code>node --test</code>. Ek paket gerekmez!</p>
<pre><code>import test from 'node:test';
import assert from 'node:assert/strict';

test('topla', () =&gt; {
  assert.strictEqual(topla(2, 3), 5);
});</code></pre>
<p>Laboratuvarda <code>node:test</code> yok ama <code>assert</code> var; sağda küçük bir test çalıştırıcıyı kendimiz yazıyoruz — gerçek araçların nasıl çalıştığını görmek için harika bir egzersiz.</p>
<h3>İyi test alışkanlıkları</h3>
<ul><li>Her test tek bir davranışı doğrulasın</li><li>Kenar durumları (boş, negatif, null) test et</li><li>Saf (pure) fonksiyonlar en kolay test edilir — iş mantığını G/Ç'den ayır</li></ul>
<div class="task" data-task>🎯 <b>Görev:</b> Kasıtlı olarak başarısız olan testi düzelt ki tüm testler geçsin: çıktıda <code>0 başarısız</code> yazmalı.</div>
`, `
const assert = require("assert");

// Test edilecek kod
function slugify(s) {
  return s.toLowerCase()
    .replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s")
    .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ç/g, "c")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

// Mini test çalıştırıcı
const testler = [];
const test = (ad, fn) => testler.push({ ad, fn });

test("küçük harfe çevirir", () => assert.strictEqual(slugify("NODE"), "node"));
test("boşlukları tire yapar", () => assert.strictEqual(slugify("merhaba dünya"), "merhaba-dunya"));
test("Türkçe karakterler", () => assert.strictEqual(slugify("Çağrı Şükür"), "cagri-sukur"));
test("baş/son tireleri siler", () => assert.strictEqual(slugify("  selam!  "), "selam"));
test("kasıtlı hata", () => assert.strictEqual(slugify("A B"), "a_b"));

let gecti = 0, kaldi = 0;
for (const t of testler) {
  try { await t.fn(); gecti++; console.log("  ✔", t.ad); }
  catch (e) { kaldi++; console.log("  ✖", t.ad, "\\n     ", e.message.split("\\n").join(" ")); }
}
console.log(\`\\n\${gecti} başarılı, \${kaldi} başarısız\`);
if (kaldi) process.exitCode = 1;
`, { check: o => /0 başarısız/.test(o) });

lesson('İleri','proje','Proje: URL kısaltıcı servisi', `
<p>Öğrendiklerini birleştirme zamanı! Bu derste tam bir mini servis var:</p>
<ul>
<li>HTTP sunucusu + JSON API</li>
<li><code>crypto</code> ile kısa kod üretimi</li>
<li><code>fs/promises</code> ile kalıcı kayıt</li>
<li><code>EventEmitter</code> ile istatistik</li>
<li>Hata yönetimi ve doğrulama</li>
<li>302 yönlendirme</li>
</ul>
<div class="task" data-task>🎯 <b>Görev:</b> <code>GET /istatistik</code> uç noktası ekle; tüm kısa linkleri ve tıklanma sayılarını JSON olarak döndürsün. Test edip çıktıda <code>tiklanma</code> göster.</div>
<div class="note">Bonus: Aynı uzun URL ikinci kez gönderilirse yeni kod üretmek yerine mevcut kodu döndür.</div>
`, `
const http = require("http");
const crypto = require("crypto");
const { readFile, writeFile } = require("fs/promises");
const EventEmitter = require("events");

const DB = "/proje/linkler.json";
const olaylar = new EventEmitter();
const yukle = async () => { try { return JSON.parse(await readFile(DB, "utf8")); } catch { return {}; } };
const kaydet = (d) => writeFile(DB, JSON.stringify(d, null, 2));

olaylar.on("tik", (kod) => console.log(\`   📊 '\${kod}' tıklandı\`));

const server = http.createServer(async (req, res) => {
  const gonder = (kod, veri, basliklar = {}) => {
    res.writeHead(kod, { "Content-Type": "application/json", ...basliklar });
    res.end(veri ? JSON.stringify(veri) : "");
  };
  try {
    const db = await yukle();
    if (req.method === "POST" && req.url === "/kisalt") {
      let body = ""; for await (const c of req) body += c;
      const { url } = JSON.parse(body || "{}");
      try { new URL(url); } catch { return gonder(400, { hata: "Geçerli bir URL gönder" }); }
      const kod = crypto.randomBytes(3).toString("base64").replace(/[+/=]/g, "x");
      db[kod] = { url, tiklanma: 0, olusturma: new Date().toISOString() };
      await kaydet(db);
      return gonder(201, { kisa: \`http://localhost:7000/\${kod}\`, kod });
    }
    const kod = req.url.slice(1);
    if (req.method === "GET" && db[kod]) {
      db[kod].tiklanma++; await kaydet(db);
      olaylar.emit("tik", kod);
      return gonder(302, null, { Location: db[kod].url });
    }
    gonder(404, { hata: "Böyle bir kısa link yok" });
  } catch (e) {
    gonder(500, { hata: e.message });
  }
});
server.listen(7000, () => console.log("🔗 Kısaltıcı 7000 portunda\\n"));

// ---- Demo ----
const post = (url) => fetch("http://localhost:7000/kisalt", { method: "POST", body: JSON.stringify({ url }) });
const r = await post("https://nodejs.org/en/learn");
const { kod, kisa } = await r.json();
console.log("Oluşturuldu:", r.status, kisa);

for (let i = 0; i < 3; i++) {
  const g = await fetch(kisa);
  console.log("Yönlendirme:", g.status, "→", g.headers.get("location"));
}
console.log("Hatalı:", (await post("bu-url-degil")).status);
console.log("Yok   :", (await fetch("http://localhost:7000/zzz")).status);
console.log("\\nDisk:", await readFile(DB, "utf8"));
server.close();
`, { check: o => /tiklanma/.test(o) && /istatistik/i.test(o) || /"tiklanma":\s*\d+[\s\S]*\}\s*$/.test(o) && /\/istatistik/.test(o) });

// Üretimde zarif kapanma (graceful shutdown) deseni
const http = require("http");

const server = http.createServer(async (req, res) => {
  await new Promise(r => setTimeout(r, 100)); // yavaş bir iş
  res.end("tamam");
});
server.listen(3000, () => console.log("Sunucu çalışıyor (pid", process.pid + ")"));

async function kapat(sinyal) {
  console.log(\`\\n\${sinyal} alındı, yeni istekler reddediliyor...\`);
  server.close(async () => {
    console.log("Açık istekler bitti, DB bağlantısı kapatılıyor...");
    await new Promise(r => setTimeout(r, 50));
    console.log("Temiz kapandı ✔");
  });
}
process.on("SIGTERM", () => kapat("SIGTERM"));

// Bir istek gönderip hemen ardından kapanma sinyali simüle edelim
const istek = fetch("http://localhost:3000").then(r => r.text());
await new Promise(r => setTimeout(r, 20)); // istek sunucuya ulaşsın
process.emit("SIGTERM");
console.log("İstek yine de tamamlandı:", await istek);
`, { check: o => /Temiz kapandı/.test(o) });

MAJOR.MINOR.PATCH →  kırıcı değişiklik . yeni özellik . hata düzeltmesi</code></pre>

<div class="note">💡 Sağdaki kod, npm'in <code>^</code> ve <code>~</code> aralıklarını nasıl yorumladığını simüle eder.</div>

// npm'in semver aralıklarını nasıl yorumladığını görelim
const parse = v => v.split(".").map(Number);

function uyarMi(surum, aralik) {
  const [M, m, p] = parse(surum);
  const op = aralik[0];
  const [aM, am, ap] = parse(aralik.replace(/^[\\^~]/, ""));
  const buyukEsit = M > aM || (M === aM && (m > am || (m === am && p >= ap)));
  if (op === "^") return buyukEsit && M === aM;
  if (op === "~") return buyukEsit && M === aM && m === am;
  return surum === aralik;
}

const surumler = ["4.21.0", "5.0.0", "5.1.0", "5.1.3", "5.2.0", "6.0.0"];
for (const aralik of ["^5.1.0", "~5.1.0", "5.1.0"]) {
  console.log(aralik.padEnd(8), "→", surumler.filter(s => uyarMi(s, aralik)).join(", "));
}
`, { tool:true });

/* =====================================================================
   KOD DOKTORU — kural tabanlı statik analiz + çalıştırarak teşhis
   ===================================================================== */
const KNOWN_MODULES = { fs:'fs', path:'path', http:'http', os:'os', crypto:'crypto', util:'util', EventEmitter:'events', assert:'assert', stream:'stream' };
const GLOBALS = ['console','process','require','module','exports','setTimeout','setInterval','setImmediate','clearTimeout','clearInterval','Buffer','JSON','Math','Promise','fetch','__dirname','__filename','Object','Array','String','Number','Boolean','Date','Error','TypeError','Map','Set','RegExp','Symbol','parseInt','parseFloat','isNaN','URL','undefined','null','true','false','await','async','return','function','const','let','class','new','this','typeof'];

function lev(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function closest(word, cands){ let best=null, bd=Infinity; for(const c of new Set(cands)){ if(c===word) continue; const d=lev(word,c); if(d<bd){ bd=d; best=c; } } return bd <= (word.length>4?2:1) ? best : null; }
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

// Metin/yorum dışındaki karakterleri işaretleyen tarayıcı (parantez dengesi için)
function codeMask(src){ const m=new Array(src.length).fill(true); let i=0, q=null;
  while(i<src.length){ const ch=src[i], nx=src[i+1];
    if(q){ m[i]=false; if(ch==='\\'){ m[i+1]=false; i+=2; continue; } if(ch===q || (ch==='\n' && q!=='`')) q=null; i++; continue; }
    if(ch==='/'&&nx==='/'){ while(i<src.length&&src[i]!=='\n'){ m[i++]=false; } continue; }
    if(ch==='/'&&nx==='*'){ const e=src.indexOf('*/',i+2); const end=e<0?src.length:e+2; for(;i<end;i++) m[i]=false; continue; }
    if(ch==='"'||ch==="'"||ch==='`'){ q=ch; m[i]=false; } i++; }
  return m; }

// ---------- sözdizimi onarımları ----------
function fixQuotes(c){ return c.split('\n').map(line=>{
  const t=line.replace(/\\./g,''); if(/\/\//.test(t.split(/["']/)[0])) return line;
  for(const q of ['"',"'"]){ const other=q==='"'?"'":'"'; const parts=t.split(other); if((t.split(q).length-1)%2===1 && parts.length%2===1 && !t.includes('`')) return line.replace(/(\s*[);,]*\s*)$/, q+'$1'); }
  return line; }).join('\n'); }
function fixCommas(c){ const ls=c.split('\n'); for(let i=0;i<ls.length-1;i++){ let j=i+1; while(j<ls.length&&!ls[j].trim()) j++; if(j>=ls.length) break;
  if(/^\s*[\w$"']+\s*:\s*\S.*[^,{(\[\s]\s*$/.test(ls[i]) && !/\/\//.test(ls[i]) && /^\s*([\w$"']+\s*:|\.\.\.)/.test(ls[j])) ls[i]=ls[i].replace(/\s*$/,','); } return ls.join('\n'); }
function fixBrackets(c){
  const pairs={'(':')','[':']','{':'}'};
  // 1) satır içi: ';' ile biten ama kapanmamış ( veya [ içeren satırlar
  let ls=c.split('\n').map(line=>{ const m=codeMask(line); const st=[]; for(let i=0;i<line.length;i++){ if(!m[i]) continue; const ch=line[i]; if('(['.includes(ch)) st.push(ch); else if(')]'.includes(ch)){ if(st.length&&pairs[st[st.length-1]]===ch) st.pop(); } else if(ch==='{'||ch==='}') return line; }
    if(st.length && /;\s*$/.test(line)) return line.replace(/;\s*$/, st.reverse().map(x=>pairs[x]).join('')+';'); return line; });
  c=ls.join('\n');
  // 2) dosya sonu: kalan açık parantezleri kapat
  const m=codeMask(c), st=[]; for(let i=0;i<c.length;i++){ if(!m[i]) continue; const ch=c[i]; if(pairs[ch]) st.push(ch); else if(')]}'.includes(ch) && st.length && pairs[st[st.length-1]]===ch) st.pop(); }
  if(st.length) c=c.replace(/\s*$/,'\n')+st.reverse().map(x=>pairs[x]).join('')+'\n';
  return c; }
function fixAsync(c){
  const m=codeMask(c); const re=/\bawait\b/g; let r, out=c, inserts=new Set();
  while((r=re.exec(c))){ if(!m[r.index]) continue; let depth=0;
    for(let i=r.index-1;i>=0;i--){ if(!m[i]) continue; const ch=c[i]; if(ch==='}') depth++; else if(ch==='{'){ if(depth){ depth--; continue; }
        const before=c.slice(Math.max(0,i-200),i);

        if(!mm){ const mth=before.match(/(?:^|[\s;{}])([\w$]+)(\s*\([^()]*\)\s*)$/); if(mth && !/^(if|for|while|switch|catch|with)$/.test(mth[1])) mm=[mth[1]+mth[2]]; }
        if(mm){ const pos=i-mm[0].length+ (before.length - before.length); const start=c.lastIndexOf(mm[0].trimEnd(), i); if(!/async\s*$/.test(c.slice(Math.max(0,start-7),start))) inserts.add(start); break; }
      } }
  }
  [...inserts].sort((a,b)=>b-a).forEach(p=>{ out=out.slice(0,p)+'async '+out.slice(p); });

// ---------- statik kurallar ----------
const STATIC_RULES = [
  { t:'new Buffer() → Buffer.from()', w:'new Buffer() güvenlik nedeniyle kullanımdan kaldırıldı (deprecated).', f:c=>c.replace(/new Buffer\(/g,'Buffer.from(') },
  { t:'var → let', w:'var fonksiyon kapsamlıdır ve beklenmedik hatalara yol açar; let/const blok kapsamlıdır.', f:c=>c.replace(/(^|[\s;(])var\s+/gm,'$1let ') },
  { t:'== / != → === / !==', w:'Gevşek eşitlik tür dönüştürür ("1" == 1 → true). Katı eşitlik daha güvenlidir.', f:c=>{ const m=codeMask(c); return c.replace(/([^=!<>])(==|!=)(?!=)/g,(x,a,op,o)=> m[o+1] && !/^\s*null\b/.test(c.slice(o+x.length)) ? a+op+'=' : x); } },
  { t:'readFileSync için "utf8" kodlaması eklendi', w:'Kodlama verilmezse readFileSync bir Buffer döner; metin işlemleri (split, includes…) çalışmaz.', f:c=>c.replace(/readFileSync\(\s*([^,()]+?)\s*\)/g,'readFileSync($1, "utf8")') },
  { t:'Callback\'siz fs çağrısı → await fs.promises', w:'fs.readFile vb. bir callback ister; vermezsen "Callback must be a function" hatası alırsın. Modern yol: await fs.promises.', f:c=>c.replace(/(^|[^\w.])(?<!await\s)fs\.(readFile|writeFile|appendFile|readdir|stat|unlink|mkdir|rename)\(((?:[^()]|\([^()]*\))*)\)/g,(x,p,fn,args)=> /=>|function|,\s*(cb|callback|done|next)\s*$/.test(args) ? x : `${p}await fs.promises.${fn}(${args})`) },
  { t:'Promise döndüren çağrıya await eklendi', w:'fetch ve fs/promises Promise döndürür; await olmadan değişken bir Promise nesnesi olur, veri değil.', f:c=>{
      c=c.replace(/(=|return)\s*(?!await)(fetch\(|fs\.promises\.\w+\(|readFile\(|writeFile\(|readdir\()/g,'$1 await $2');
      const fetched=[...c.matchAll(/(?:const|let)\s+([\w$]+)\s*=\s*await\s+fetch\(/g)].map(x=>x[1]);

  { t:'Callback\'e hata kontrolü eklendi', w:'Node callback\'lerinde ilk argüman hatadır; kontrol etmezsen data undefined olur ve program çöker.', f:c=>c.replace(/\(\s*(err|error|hata)\s*,\s*[\w$]+\s*\)\s*=>\s*\{([ \t]*\n)?(\s*)/g,(x,e,nl,ind,o)=>{ const body=c.slice(o+x.length,o+x.length+120); if(new RegExp('\\b'+e+'\\b').test(body)) return x; const indent=ind||'  '; return x.replace(/\{([ \t]*\n)?(\s*)$/,`{\n${indent}if (${e}) return console.error("Hata:", ${e}.message);\n${indent}`); }) },
  { t:'res.send → res.end', w:'res.send Express\'e özgüdür; saf http modülünde yanıt res.end() ile gönderilir.', f:c=> /createServer/.test(c) && !/express/.test(c) ? c.replace(/\bres\.send\(/g,'res.end(') : c },
  { t:'Eksik modül içe aktarımları eklendi', w:'Node çekirdek modülleri otomatik yüklenmez; require ile içe aktarılmalıdır.', f:c=>{
      const add=[];
      for(const [name,mod] of Object.entries(KNOWN_MODULES)){ const used = new RegExp(`(^|[^\\w.$])${name}\\s*[.(]|new\\s+${name}\\b|extends\\s+${name}\\b`).test(c); const declared = new RegExp(`\\b(const|let|var)\\s+(${name}\\b|\\{[^}]*\\b${name}\\b[^}]*\\})|\\bimport\\b[^\\n;]*\\b${name}\\b|\\b(function|class)\\s+${name}\\b`).test(c);
        if(used && !declared) add.push(`const ${name} = require("${mod}");`); }
      const fp=['readFile','writeFile','appendFile','readdir','mkdir'].filter(n=> new RegExp(`(^|[^\\w.$])${n}\\(`).test(c) && !new RegExp(`\\b(const|let|var)\\s+(${n}\\b|\\{[^}]*\\b${n}\\b[^}]*\\})|\\bimport\\b[^\\n;]*\\b${n}\\b|\\bfunction\\s+${n}\\b`).test(c));
      if(fp.length) add.push(`const { ${fp.join(', ')} } = require("fs/promises");`);
      return add.length ? add.join('\n')+'\n'+c : c; } },
];
const WARN_RULES = [
  [c=>/require\(\s*["'](express|axios|lodash|mongoose|dotenv)["']\)/.test(c), 'npm paketi kullanılıyor; laboratuvarda npm paketleri yok. Kodu gerçek Node + npm install ile çalıştırmalısın (son derse bak).'],

function explainError(e){

    [/Unexpected token|Unexpected identifier|Unexpected end/, 'Sözdizimi hatası: parantez, tırnak, virgül veya noktalı virgül eksik/fazla olabilir.'],
    [/ENOENT/, 'Dosya bulunamadı. Yolu kontrol et; laboratuvardaki dosyalar /proje altında: merhaba.txt, veri.json, log.txt.'],
    [/ECONNREFUSED|fetch failed/, 'Bağlanılacak sunucu yok. server.listen(PORT) çağrıldı mı, port doğru mu, sunucu fetch\'ten önce kapatılmış olabilir mi?'],
    [/Unexpected .* JSON|JSON at position|is not valid JSON/, 'Geçersiz JSON parse edilmeye çalışılıyor. Girdi gerçekten JSON mu? try/catch ile sar.'],
    [/Cannot find module/, 'Modül bulunamadı. Laboratuvarda yalnızca çekirdek modüller var.'],
    [/before initialization/, 'Değişken tanımlanmadan önce kullanılıyor (TDZ). Tanımı kullanımdan yukarı taşı.'],
    [/Callback must be a function/, 'Callback tabanlı fonksiyona callback verilmemiş; fs/promises sürümünü await ile kullan.'],
  ];
  const t=tips.find(([r])=>r.test(m)); return t?t[1]:'Hata mesajını ve ilgili satırı dikkatle incele; console.log ile ara değerleri yazdırmak yardımcı olur.';
}

function fixRuntime(c, e){
  const msg=String(e&&e.message||e), name=e&&e.name;
  if (name==='SyntaxError'){
    if (/await is only valid/.test(msg)){ const n=fixAsync(c); if(n!==c) return {code:n, t:'Fonksiyona async eklendi', w:'await yalnızca async fonksiyonlar içinde (veya modülün en üst seviyesinde) kullanılabilir.'}; }
    for (const [fn,t,w] of [[fixCommas,'Nesnede eksik virgül eklendi','Nesne özellikleri virgülle ayrılmalıdır.'],[fixQuotes,'Kapanmamış tırnak kapatıldı','Her açılan tırnak aynı satırda kapanmalıdır.'],[fixBrackets,'Eksik parantez kapatıldı','Açılan her ( [ { için bir kapanış gerekir.'],[fixAsync,'Fonksiyona async eklendi','await yalnızca async fonksiyonlar içinde kullanılabilir.']]){
      const n=fn(c); if(n!==c) return {code:n,t,w}; }
    return null;
  }
  let mm;
  if ((mm=msg.match(/^([\w$]+) is not defined/))){
    const v=mm[1];
    if (KNOWN_MODULES[v]) return {code:`const ${v} = require("${KNOWN_MODULES[v]}");\n`+c, t:`${v} modülü içe aktarıldı`, w:'Çekirdek modüller require ile yüklenmelidir.'};
    const ids=[...c.matchAll(/[A-Za-z_$][\w$]*/g)].map(x=>x[0]);
    const best=closest(v,[...GLOBALS,...ids.filter(x=>x!==v)]);
    if (best) return {code:c.replace(new RegExp(`(^|[^\\w$.])${esc(v)}(?![\\w$])`,'g'),`$1${best}`), t:`Yazım hatası: ${v} → ${best}`, w:`"${v}" tanımlı değil; büyük olasılıkla "${best}" kastedildi.`};
  }
  if ((mm=msg.match(/(\S*)\.([\w$]+) is not a function/))){
    const [, obj, meth]=mm;
    const pools={ fs:Object.keys(fs), 'fs.promises':Object.keys(fs.promises), path:Object.keys(path), JSON:['parse','stringify'], console:['log','error','warn','info','table','time','timeEnd','debug'], Object:Object.getOwnPropertyNames(Object), Math:Object.getOwnPropertyNames(Math), Array:Object.getOwnPropertyNames(Array), crypto:Object.keys(crypto), util:Object.keys(util), os:Object.keys(os), http:Object.keys(http), process:['on','exit','cwd','nextTick','uptime','memoryUsage','emit'], Promise:['all','allSettled','race','any','resolve','reject'] };
    const pool = pools[obj] || [...Object.getOwnPropertyNames(String.prototype),...Object.getOwnPropertyNames(Array.prototype),'json','text','on','once','emit','listen','close','end','write','setHeader','writeHead','then','catch','finally'];
    const best=closest(meth,pool);
    if (best) return {code:c.replace(new RegExp(`\\.${esc(meth)}\\(`,'g'),`.${best}(`), t:`Yanlış metot adı: .${meth}() → .${best}()`, w:`"${meth}" diye bir metot yok; doğrusu "${best}". JavaScript büyük/küçük harfe duyarlıdır.`};
  }
  if (/Assignment to constant variable/.test(msg)){
    for (const d of c.matchAll(/\bconst\s+([\w$]+)\s*=/g)){ const v=d[1]; const after=c.slice(d.index+d[0].length);
      if (new RegExp(`(^|[^\\w$.])${esc(v)}\\s*(=(?!=)|\\+\\+|--|[+\\-*/]=)|(\\+\\+|--)${esc(v)}\\b`).test(after))
        return {code:c.slice(0,d.index)+'let '+c.slice(d.index+6), t:`const ${v} → let ${v}`, w:'const ile tanımlanan değişkene yeniden değer atanamaz; değişecekse let kullan.'}; }
  }
  if (/Callback must be a function/.test(msg)){ const n=STATIC_RULES[4].f(c); if(n!==c) return {code:n,t:STATIC_RULES[4].t,w:STATIC_RULES[4].w}; }
  return null;
}

async function diagnose(code){
  let c=code; const fixes=[], warnings=[];
  for (const r of STATIC_RULES){ try{ const n=r.f(c); if(n!==c){ fixes.push({t:r.t,w:r.w}); c=n; } }catch{} }
  let remaining=null;
  for (let i=0;i<8;i++){
    QUIET=true; try{ await runCode(c,{maxWait:3000}); } finally { QUIET=false; }
    const e=LAST_ERR; if(!e){ remaining=null; break; }
    const r=fixRuntime(c,e); if(!r){ remaining=e; break; }
    fixes.push({t:r.t,w:r.w}); c=r.code;
    // sözdizimi düzeldikten sonra statik kurallar tekrar şans bulsun
    for (const s of STATIC_RULES){ try{ const n=s.f(c); if(n!==c){ if(!fixes.some(f=>f.t===s.t)) fixes.push({t:s.t,w:s.w}); c=n; } }catch{} }
  }
  WARN_RULES.forEach(([t,msg])=>{ try{ if(t(c)) warnings.push(msg); }catch{} });
  return { code:c, fixes, warnings, remaining };
}

function lineDiff(a,b){ const A=a.split('\n'), B=b.split('\n'), n=A.length, m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0; while(i<n&&j<m){ if(A[i]===B[j]){ out.push([' ',A[i]]); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) out.push(['-',A[i++]]); else out.push(['+',B[j++]]); }
  while(i<n) out.push(['-',A[i++]]); while(j<m) out.push(['+',B[j++]]); return out; }

let doctorUndo = null;
async function runDoctor(){
  const original=editor.value; const statusEl=document.getElementById('status');
  if(!original.trim()){ outEl.innerHTML='<span class="w">Önce düzeltilecek kodu editöre yapıştır.</span>'; return; }
  statusEl.textContent='🩺 analiz ediliyor…'; outEl.innerHTML='<span class="s">🩺 Kod Doktoru kodu inceliyor ve deneme çalıştırması yapıyor…</span>';
  const r=await diagnose(original);
  statusEl.textContent='🩺 rapor hazır';
  const h=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let html='<b style="color:#79c0ff">🩺 Kod Doktoru Raporu</b>\n\n';
  if(!r.fixes.length && !r.remaining) html+='<span style="color:#3fb950">✔ Otomatik düzeltilecek bir hata bulunamadı. Kod hatasız çalışıyor.</span>\n';
  r.fixes.forEach((f,i)=>{ html+=`<span style="color:#3fb950">✔ ${i+1}. ${h(f.t)}</span>\n<span class="s">   ${h(f.w)}</span>\n`; });
  r.warnings.forEach(w=>{ html+=`<span class="w">⚠ ${h(w)}</span>\n`; });
  if(r.remaining) html+=`\n<span class="e">✖ Otomatik düzeltilemedi: ${h(String(r.remaining.name||'Hata'))}: ${h(String(r.remaining.message||r.remaining))}</span>\n<span class="w">💡 ${h(explainError(r.remaining))}</span>\n`;
  if(r.code!==original){
    html+='\n<b>Değişiklikler:</b>\n';
    const d=lineDiff(original,r.code); d.forEach(([k,l],idx)=>{ const near=d.slice(Math.max(0,idx-1),idx+2).some(x=>x[0]!==' '); if(k===' '&&!near) return;
      html+= k==='+'?`<span style="color:#3fb950;background:#12261a">+ ${h(l)}</span>\n` : k==='-'?`<span style="color:#ff7b72;background:#2d1214">- ${h(l)}</span>\n` : `<span class="s">  ${h(l)}</span>\n`; });
    html+='\n<button class="btn" id="docApply">✅ Uygula ve çalıştır</button> <button class="btn sec" id="docCancel">Vazgeç</button>';
  }
  outEl.innerHTML=html;
  const ap=document.getElementById('docApply');
  if(ap){ ap.onclick=()=>{ doctorUndo=original; editor.value=r.code; updateGutter(); saveDraft(); run().then?.(()=>{}); setTimeout(addUndo,50); };
    document.getElementById('docCancel').onclick=()=>{ outEl.innerHTML='<span class="s">Değişiklik yapılmadı.</span>'; }; }
}
function addUndo(){ if(!doctorUndo) return; const b=document.createElement('div'); b.style.margin='0 0 8px'; b.innerHTML='<button class="btn sec">↶ Doktor değişikliklerini geri al</button>';
  b.firstChild.onclick=()=>{ editor.value=doctorUndo; doctorUndo=null; updateGutter(); saveDraft(); b.remove(); }; outEl.prepend(b); }
document.getElementById('fixBtn').onclick = runDoctor;
</script>
